<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icon Proposals</title>
  <style>
    body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
    .card img { width: 100%; height: auto; border-radius: 12px; display: block; background: #111827; }
    .label { margin-top: 8px; font-size: 14px; font-weight: 700; }
    .desc { margin-top: 4px; font-size: 12px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>iPhone PWA Icon Concept Preview</h1>
    <div class="grid">
      <div class="card">
        <img src="./a-min-calendar.svg" alt="A minimal calendar" />
        <div class="label">A안 · 미니멀 캘린더</div>
        <div class="desc">가독성 높은 캘린더 + 체크</div>
      </div>
      <div class="card">
        <img src="./b-il-glyph.svg" alt="B il glyph" />
        <div class="label">B안 · 일(一) 타이포</div>
        <div class="desc">현재 컨셉 유지, 획 정리</div>
      </div>
      <div class="card">
        <img src="./c-gradient-calendar.svg" alt="C gradient calendar" />
        <div class="label">C안 · 그라데이션</div>
        <div class="desc">밝고 눈에 띄는 아이콘</div>
      </div>
      <div class="card">
        <img src="./d-premium-line.svg" alt="D premium line" />
        <div class="label">D안 · 프리미엄 다크</div>
        <div class="desc">얇은 라인 + 오렌지 포인트</div>
      </div>
    </div>
  </div>
</body>
</html>
